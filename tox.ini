# Test matrix: the oldest supported Wagtail LTS, the latest release, and Wagtail main.
# PostgreSQL: set DATABASE_URL=postgres://user:pass@host:port/db before running tox.
[tox]
min_version = 4
env_list = wt74-dj{52,60}, wt81-dj61, wtmain-dj61

[testenv]
# Editable, because the wheel leaves out the test project the tests need.
package = editable
pass_env = DATABASE_URL
dependency_groups = dev
deps =
    dj52: django>=5.2,<5.3
    dj60: django>=6.0,<6.1
    dj61: django>=6.1,<6.2
    wt74: wagtail>=7.4,<7.5
    wt81: wagtail>=8.1,<8.2
    wtmain: wagtail @ git+https://github.com/wagtail/wagtail.git@main
    psycopg[binary]
commands =
    python -m pytest {posargs}
